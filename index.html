<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Matematika</title>
    <!-- MathJax untuk render rumus matematika LaTeX -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1e3a8a; }
        .form-group { margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .question { margin-top: 30px; font-weight: bold; }
        .options { margin-top: 10px; }
        .option { margin-bottom: 10px; display: flex; align-items: baseline; gap: 10px;}
        button { display: block; width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 30px; }
        button:hover { background: #1d4ed8; }
        #loading { display: none; text-align: center; color: #d97706; font-weight: bold; margin-top: 15px; }
        #result { display: none; text-align: center; margin-top: 20px; padding: 20px; background: #dcfce7; color: #166534; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Kuis Matematika</h2>
    <form id="quizForm">
        <div class="form-group">
            <label for="nama"><strong>Nama Lengkap:</strong></label>
            <input type="text" id="nama" name="Nama" required placeholder="Masukkan nama Anda">
        </div>

        <div id="quiz-content"></div>

        <button type="submit" id="submitBtn">Kirim Jawaban</button>
        <div id="loading">Mengirim jawaban... Mohon tunggu.</div>
    </form>

    <div id="result">
        <h3 id="score-display"></h3>
        <p>Terima kasih telah mengerjakan kuis ini. Nilai Anda sudah tersimpan.</p>
    </div>
</div>

<script>
    // URL dari Google Apps Script (Langkah 2)
    const scriptURL = 'https://script.google.com/macros/s/AKfycby8cLnkM4VCthq0Dj8PsgHn69VUZwVgksNRAGrg8vGEBT7IaJAk0853Lvz9aXhGghua3Q/exec'; 

    // Data Soal (Rumus LaTeX dibungkus dengan \( \) untuk MathJax)
    const questions = [
        {
            q: "Jika untuk setiap \\(a, b\\) bilangan real berlaku \\(a \\otimes b = ab + a - b\\), maka \\((a+b) \\otimes (a-b)\\) sama dengan ....",
            options: ["\\(a^2 - b^2 + 2b\\)", "\\(a^2 - b^2 + 2a\\)", "\\(a^2 - b^2 - 2a\\)", "\\(a^2 - b^2 - 2b\\)", "\\(a^2 + b^2 + 2b\\)"],
            answer: 0 // Index A = 0
        },
        {
            q: "Jika \\(k > 4\\), maka di antara pilihan berikut yang nilainya paling kecil adalah ....",
            options: ["\\(\\frac{k}{4}\\)", "\\(\\frac{4}{k+2}\\)", "\\(\\frac{4}{k}\\)", "\\(\\frac{4}{k-1}\\)", "\\(\\frac{k+1}{4}\\)"],
            answer: 1 // Index B = 1
        },
        {
            q: "Diketahui \\(p(r - 3) = 0\\), \\(q(r - 7) = 0\\), dan \\(3 < 7\\). Pernyataan berikut yang pasti benar adalah ....",
            options: ["\\(pq > 0\\)", "\\(pq < 0\\)", "\\(p + q = 0\\)", "\\(p = q\\)", "\\(pq = 0\\)"],
            answer: 4 // Index E = 4
        },
        {
            q: "\\(a, b, c\\) adalah bilangan positif yang memenuhi \\(ab = \\frac{c}{3}\\). Jika \\(a\\) bertambah 20% dan \\(b\\) berkurang 10%, berapakah perubahan \\(c\\) agar hubungan \\(ab = \\frac{c}{3}\\) tetap terpenuhi?",
            options: ["\\(c\\) bertambah 8%", "\\(c\\) berkurang 8%", "\\(c\\) bertambah 10%", "\\(c\\) berkurang 10%", "\\(c\\) bertambah 12%"],
            answer: 0 // Index A = 0
        },
        {
            q: "Banyaknya pasangan bilangan bulat positif \\((x, y)\\) dengan \\(x < y\\) yang memenuhi persamaan \\(\\sqrt{x} + \\sqrt{y} = \\sqrt{1080}\\) adalah ....",
            options: ["0", "1", "2", "3", "4"],
            answer: 2 // Index C = 2
        },
        {
            q: "Panjang suatu persegi panjang adalah 3 cm lebih panjang dari lebarnya. Jika lebarnya bertambah 3 cm dan panjangnya bertambah 2 cm, maka luasnya menjadi dua kali luas semula. Luas persegi panjang semula adalah ....",
            options: ["18 cm\\(^2\\)", "28 cm\\(^2\\)", "40 cm\\(^2\\)", "48 cm\\(^2\\)", "60 cm\\(^2\\)"],
            answer: 2 // Index C = 2
        },
        {
            q: "Sebuah wadah berisi 200 kelereng dan 90% di antaranya berwarna biru. Dari wadah tersebut diambil sejumlah kelereng biru sehingga persentase kelereng biru di dalam wadah menjadi 60%. Berapa banyak kelereng biru yang diambil?",
            options: ["100", "120", "140", "150", "160"],
            answer: 3 // Index D = 3
        },
        {
            q: "Budi berjalan ke perpustakaan, rata-rata ia melangkah 80 kali per menit dengan panjang tiap langkah 70 cm. Ia membutuhkan waktu 15 menit. Andi berjalan ke perpustakaan yang sama melalui rute yang sama dengan 100 langkah per menit, tetapi panjang langkahnya hanya 60 cm. Berapa lama waktu yang dibutuhkan Andi?",
            options: ["10 menit", "12 menit", "14 menit", "16 menit", "18 menit"],
            answer: 2 // Index C = 2
        },
        {
            q: "Diketahui kerucut terbalik yang dibagi menjadi 3 bagian (A di atas, B di tengah, dan C di bawah) oleh bidang sejajar alas. Kerucut C (puncak bawah) memiliki jari-jari \\(r\\) dan tinggi \\(t\\). Gabungan (B+C) membentuk kerucut sebanding dengan jari-jari \\(2r\\) dan tinggi \\(2t\\). Gabungan (A+B+C) membentuk kerucut sebanding dengan jari-jari \\(3r\\) dan tinggi \\(3t\\). Berapakah perbandingan Volume A : Volume C?",
            options: ["19 : 1", "19 : 7", "7 : 1", "9 : 1", "27 : 1"],
            answer: 0 // Index A = 0
        },
        {
            q: "Sebuah toko menetapkan harga suatu barang dalam dolar dan sen sedemikian hingga jika ditambahkan pajak penjualan 5%, tidak perlu diadakan pembulatan sebab hasilnya tepat \\(n\\) dolar. Nilai terkecil untuk \\(n\\) adalah ....",
            options: ["1", "20", "21", "25", "105"],
            answer: 2 // Index C = 2
        }
    ];

    const quizContent = document.getElementById('quiz-content');
    const letters = ['A', 'B', 'C', 'D', 'E'];

    // Render HTML untuk Soal
    questions.forEach((item, index) => {
        let html = `<div class="question">${index + 1}. ${item.q}</div><div class="options">`;
        item.options.forEach((opt, i) => {
            html += `
            <label class="option">
                <input type="radio" name="q${index}" value="${i}" required> 
                ${letters[i]}. ${opt}
            </label>`;
        });
        html += `</div>`;
        quizContent.innerHTML += html;
    });

    // Proses Submit Jawaban
    document.getElementById('quizForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        let score = 0;
        let details = [];

        // Hitung skor dan catat jawaban
        questions.forEach((item, index) => {
            let selected = parseInt(document.querySelector(`input[name="q${index}"]:checked`).value);
            if(selected === item.answer) {
                score += 10; // Setiap soal benar nilainya 10 (Total 100)
                details.push(`Q${index+1}: Benar`);
            } else {
                details.push(`Q${index+1}: Salah (Jawab: ${letters[selected]})`);
            }
        });

        const formData = new FormData();
        formData.append('Nama', document.getElementById('nama').value);
        formData.append('Skor', score);
        formData.append('Detail', details.join(', '));

        // Kirim ke Google Sheets
        fetch(scriptURL, { method: 'POST', body: formData})
            .then(response => {
                document.getElementById('quizForm').style.display = 'none';
                document.getElementById('result').style.display = 'block';
                document.getElementById('score-display').innerText = `Skor Anda: ${score} / 100`;
            })
            .catch(error => {
                alert('Terjadi kesalahan, silakan coba lagi.');
                document.getElementById('submitBtn').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            });
    });
</script>
</body>
</html>
